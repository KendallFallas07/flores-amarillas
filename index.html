<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Un detalle para ti 💛</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #25221d 0%, #111 45%, #050505 100%);
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* =========================
       PANTALLA INICIAL
    ========================== */

    #inicio {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #050505;

      transition:
        opacity 1.3s ease,
        visibility 1.3s ease;
    }

    #inicio.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .inicio-contenido {
      width: min(90%, 600px);
      padding: 30px;
      text-align: center;
      animation: entrada 2s ease;
    }

    .inicio-contenido h1 {
      margin-bottom: 16px;
      color: #fff;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: normal;
    }

    .inicio-contenido p {
      margin-bottom: 30px;
      color: rgba(255,255,255,.65);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    button {
      padding: 14px 30px;

      border: 1px solid rgba(255,255,255,.22);
      border-radius: 40px;

      background: rgba(255,255,255,.07);
      color: white;

      font-family: inherit;
      font-size: 1rem;

      cursor: pointer;
      backdrop-filter: blur(10px);

      transition: .3s;
    }

    button:hover {
      transform: scale(1.06);
      background: rgba(255, 213, 0, .15);
      border-color: rgba(255, 213, 0, .35);
    }

    /* =========================
       MENSAJE
    ========================== */

    #mensajeContenedor {
      position: fixed;
      z-index: 10;

      top: 4%;
      left: 50%;

      width: min(90%, 760px);
      padding: 0 15px;

      text-align: center;

      opacity: 0;
      transform: translateX(-50%) translateY(20px);

      transition:
        opacity 1.5s ease,
        transform 1.5s ease;

      pointer-events: none;
    }

    #mensajeContenedor.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #mensajeContenedor h2 {
      margin-bottom: 18px;

      color: #ffd84a;
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: normal;

      text-shadow:
        0 0 25px rgba(255, 216, 74, .15);
    }

    #texto {
      min-height: 135px;

      color: #f3ede4;

      font-size: clamp(.92rem, 2.2vw, 1.15rem);
      line-height: 1.75;

      white-space: pre-line;
    }

    .cursor {
      display: inline-block;

      width: 2px;
      height: 1em;

      margin-left: 3px;

      vertical-align: middle;

      background: #ffd84a;

      animation: parpadear .8s infinite;
    }

    #final {
      margin-top: 18px;

      opacity: 0;

      color: #ffd84a;

      font-size: 1rem;
      font-style: italic;

      transition: opacity 2s ease;
    }

    #final.visible {
      opacity: 1;
    }

    #firma {
      display: block;

      margin-top: 10px;

      color: rgba(255,255,255,.45);

      font-size: .82rem;
      font-style: normal;
    }

    @keyframes entrada {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes parpadear {
      0%, 50% {
        opacity: 1;
      }

      51%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      #mensajeContenedor {
        top: 3%;
        width: 94%;
      }

      #mensajeContenedor h2 {
        margin-bottom: 12px;
      }

      #texto {
        font-size: clamp(.82rem, 3.3vw, 1rem);
        line-height: 1.55;
      }

      #final {
        margin-top: 12px;
        font-size: .9rem;
      }

      #firma {
        margin-top: 7px;
        font-size: .72rem;
      }
    }

    /*
      Si alguien usa mucho zoom y la pantalla queda muy baja,
      reducimos un poco el bloque de texto para evitar que se
      monte sobre las flores.
    */
    @media (max-height: 650px) {
      #mensajeContenedor {
        top: 2%;
      }

      #mensajeContenedor h2 {
        margin-bottom: 8px;
        font-size: clamp(1.45rem, 5vw, 2.1rem);
      }

      #texto {
        font-size: clamp(.72rem, 2vw, .92rem);
        line-height: 1.42;
      }

      #final {
        margin-top: 8px;
        font-size: .82rem;
      }

      #firma {
        margin-top: 5px;
        font-size: .68rem;
      }
    }
  </style>
</head>

<body>

  <canvas id="canvas"></canvas>

  <div id="inicio">
    <div class="inicio-contenido">

      <h1>Un pequeño detalle 💛</h1>

      <p>
        Ayer fueron flores de verdad.<br>
        Hoy quería hacer algo diferente.
      </p>

      <button id="boton">
        Verlo
      </button>

    </div>
  </div>

  <div id="mensajeContenedor">

    <h2>Para ti 🌻</h2>

    <div>
      <span id="texto"></span>
      <span class="cursor" id="cursor"></span>
    </div>

    <div id="final">
      Un detalle sencillo, pero hecho pensando en ti. 💛

      <span id="firma">
        — Unas flores hechas con un poquito de código.
      </span>
    </div>

  </div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

let animacionIniciada = false;
let animacionTerminada = false;
let resizeTimer = null;

const dprMaximo = 2;


/* ==========================================
   AJUSTAR CANVAS

   IMPORTANTE:
   cambiar canvas.width o canvas.height borra
   todo el dibujo. Por eso, una vez terminada
   la animación, si cambia el tamaño/zoom,
   redibujamos inmediatamente el ramo.
========================================== */

function ajustarCanvas() {

  W = window.innerWidth;
  H = window.innerHeight;

  const dpr = Math.min(
    window.devicePixelRatio || 1,
    dprMaximo
  );

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}


ajustarCanvas();


/* ==========================================
   ZOOM / RESIZE SEGURO

   - Antes de empezar: ajusta normalmente.
   - Durante la animación: NO borra el canvas.
   - Después de terminar: ajusta y redibuja.
========================================== */

function manejarCambioDeTamano() {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {

    if (!animacionIniciada) {

      ajustarCanvas();
      return;

    }

    if (animacionTerminada) {

      ajustarCanvas();
      dibujarRamoEstatico();

    }

    /*
      Si la animación está corriendo, no tocamos
      canvas.width ni canvas.height para que las
      flores no desaparezcan a mitad del dibujo.
    */

  }, 140);
}


window.addEventListener(
  "resize",
  manejarCambioDeTamano
);


/*
  En algunos celulares el pellizco de zoom usa
  visualViewport en lugar de disparar solamente
  el resize tradicional.
*/
if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    manejarCambioDeTamano
  );

}


/* ==========================================
   UTILIDADES
========================================== */

function esperar(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


function obtenerFlores() {

  /*
    Las cabezas se mantienen en la parte inferior
    para dejar una zona limpia al texto.
  */

  const pantallaBaja = H < 650;

  if (pantallaBaja) {

    return [
      { x: W * .50, y: H * .79, escala: .70, inclinacion: 0 },
      { x: W * .37, y: H * .84, escala: .57, inclinacion: 9 },
      { x: W * .63, y: H * .84, escala: .57, inclinacion: -9 },
      { x: W * .22, y: H * .90, escala: .45, inclinacion: 14 },
      { x: W * .78, y: H * .90, escala: .45, inclinacion: -14 }
    ];

  }

  return [
    { x: W * .50, y: H * .79, escala: .98, inclinacion: 0 },
    { x: W * .38, y: H * .84, escala: .78, inclinacion: 10 },
    { x: W * .62, y: H * .84, escala: .78, inclinacion: -10 },
    { x: W * .24, y: H * .90, escala: .62, inclinacion: 16 },
    { x: W * .76, y: H * .90, escala: .62, inclinacion: -16 }
  ];

}


/* ==========================================
   CURVA ANIMADA
========================================== */

async function dibujarCurva(
  x1,
  y1,
  cx,
  cy,
  x2,
  y2,
  color,
  grosor,
  duracion = 500
) {

  const inicio = performance.now();

  return new Promise(resolve => {

    function animar(tiempo) {

      const progreso =
        Math.min(
          (tiempo - inicio) / duracion,
          1
        );

      ctx.beginPath();
      ctx.moveTo(x1, y1);

      const pasos =
        Math.max(
          1,
          Math.ceil(
            35 * progreso
          )
        );

      for (
        let i = 1;
        i <= pasos;
        i++
      ) {

        const t = i / 35;

        const x =
          (1-t)*(1-t)*x1
          +
          2*(1-t)*t*cx
          +
          t*t*x2;

        const y =
          (1-t)*(1-t)*y1
          +
          2*(1-t)*t*cy
          +
          t*t*y2;

        ctx.lineTo(x, y);

      }

      ctx.strokeStyle = color;
      ctx.lineWidth = grosor;

      ctx.stroke();

      if (progreso < 1) {

        requestAnimationFrame(animar);

      } else {

        resolve();

      }

    }

    requestAnimationFrame(animar);

  });

}


/* ==========================================
   CURVA ESTÁTICA
========================================== */

function dibujarCurvaEstatica(
  x1,
  y1,
  cx,
  cy,
  x2,
  y2,
  color,
  grosor
) {

  ctx.beginPath();

  ctx.moveTo(x1, y1);

  ctx.quadraticCurveTo(
    cx,
    cy,
    x2,
    y2
  );

  ctx.strokeStyle = color;
  ctx.lineWidth = grosor;

  ctx.stroke();

}


/* ==========================================
   HOJA
========================================== */

function pintarHoja(
  x,
  y,
  lado,
  escala
) {

  ctx.beginPath();

  ctx.moveTo(
    x,
    y
  );

  ctx.quadraticCurveTo(

    x + 45 * lado * escala,
    y - 30 * escala,

    x + 70 * lado * escala,
    y + 5 * escala

  );

  ctx.quadraticCurveTo(

    x + 35 * lado * escala,
    y + 18 * escala,

    x,
    y

  );

  ctx.fillStyle = "#507f3c";
  ctx.fill();

  ctx.strokeStyle = "#75a663";
  ctx.lineWidth = 1.2;
  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x,
    y
  );

  ctx.lineTo(
    x + 58 * lado * escala,
    y + 2 * escala
  );

  ctx.strokeStyle =
    "rgba(180,220,150,.45)";

  ctx.lineWidth = 1;
  ctx.stroke();

}


async function dibujarHoja(
  x,
  y,
  lado,
  escala
) {

  pintarHoja(
    x,
    y,
    lado,
    escala
  );

  await esperar(90);

}


/* ==========================================
   PÉTALO
========================================== */

function pintarPetalo(
  cx,
  cy,
  angulo,
  largo,
  ancho,
  color = "#FFD42A"
) {

  const rad =
    angulo *
    Math.PI /
    180;


  const baseX =
    cx +
    Math.cos(rad) * 12;

  const baseY =
    cy +
    Math.sin(rad) * 12;


  const puntaX =
    cx +
    Math.cos(rad) * largo;

  const puntaY =
    cy +
    Math.sin(rad) * largo;


  const perpX =
    Math.cos(
      rad +
      Math.PI / 2
    );

  const perpY =
    Math.sin(
      rad +
      Math.PI / 2
    );


  const c1x =
    cx +
    Math.cos(rad) * largo * .53
    +
    perpX * ancho;

  const c1y =
    cy +
    Math.sin(rad) * largo * .53
    +
    perpY * ancho;


  const c2x =
    cx +
    Math.cos(rad) * largo * .53
    -
    perpX * ancho;

  const c2y =
    cy +
    Math.sin(rad) * largo * .53
    -
    perpY * ancho;


  ctx.beginPath();

  ctx.moveTo(
    baseX,
    baseY
  );

  ctx.quadraticCurveTo(
    c1x,
    c1y,
    puntaX,
    puntaY
  );

  ctx.quadraticCurveTo(
    c2x,
    c2y,
    baseX,
    baseY
  );


  ctx.fillStyle = color;

  ctx.shadowBlur = 10;

  ctx.shadowColor =
    "rgba(255,215,50,.22)";

  ctx.fill();

  ctx.shadowBlur = 0;


  ctx.strokeStyle =
    "rgba(255,240,130,.8)";

  ctx.lineWidth = 1;

  ctx.stroke();

}


async function dibujarPetalo(
  cx,
  cy,
  angulo,
  largo,
  ancho,
  color = "#FFD42A"
) {

  pintarPetalo(
    cx,
    cy,
    angulo,
    largo,
    ancho,
    color
  );

  await esperar(28);

}


/* ==========================================
   CENTRO DE LA FLOR
========================================== */

function dibujarCentro(
  cx,
  cy,
  radio
) {

  const gradiente =
    ctx.createRadialGradient(

      cx - radio * .25,
      cy - radio * .25,
      1,

      cx,
      cy,
      radio

    );


  gradiente.addColorStop(
    0,
    "#b47a2c"
  );

  gradiente.addColorStop(
    .45,
    "#7a4a19"
  );

  gradiente.addColorStop(
    1,
    "#38200b"
  );


  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    radio,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    gradiente;

  ctx.fill();


  /*
    Patrón determinista en el centro.
    Así el ramo no "cambia" cada vez que
    se hace zoom y se vuelve a dibujar.
  */

  const puntos = 38;
  const anguloDorado = 2.399963229728653;

  for (
    let i = 0;
    i < puntos;
    i++
  ) {

    const a =
      i *
      anguloDorado;

    const d =
      Math.sqrt(
        i / puntos
      )
      *
      radio
      *
      .72;


    const x =
      cx +
      Math.cos(a) * d;

    const y =
      cy +
      Math.sin(a) * d;


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1.1,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#dca842";

    ctx.fill();

  }

}


/* ==========================================
   FLOR ANIMADA
========================================== */

async function crearFlor(
  centroX,
  centroY,
  suelo,
  escala,
  inclinacion
) {

  const cabezaX =
    centroX +
    inclinacion;


  await dibujarCurva(

    centroX,
    suelo,

    centroX +
    inclinacion * .4,

    (
      centroY +
      suelo
    ) / 2,

    cabezaX,
    centroY + 12,

    "#4e833f",

    5 * escala,

    550

  );


  await dibujarHoja(

    centroX,

    suelo -
    (
      suelo -
      centroY
    ) * .35,

    -1,

    .63 * escala

  );


  await dibujarHoja(

    centroX + 2,

    suelo -
    (
      suelo -
      centroY
    ) * .58,

    1,

    .55 * escala

  );


  for (
    let angulo = 0;
    angulo < 360;
    angulo += 30
  ) {

    await dibujarPetalo(

      cabezaX,

      centroY,

      angulo,

      55 * escala,

      17 * escala,

      "#FFD426"

    );

  }


  for (
    let angulo = 15;
    angulo < 360;
    angulo += 30
  ) {

    await dibujarPetalo(

      cabezaX,

      centroY,

      angulo,

      43 * escala,

      13 * escala,

      "#F4BF17"

    );

  }


  dibujarCentro(

    cabezaX,

    centroY,

    18 * escala

  );

}


/* ==========================================
   FLOR ESTÁTICA
   Se usa únicamente para reconstruir el ramo
   después de un cambio de zoom/tamaño.
========================================== */

function crearFlorEstatica(
  centroX,
  centroY,
  suelo,
  escala,
  inclinacion
) {

  const cabezaX =
    centroX +
    inclinacion;


  dibujarCurvaEstatica(

    centroX,
    suelo,

    centroX +
    inclinacion * .4,

    (
      centroY +
      suelo
    ) / 2,

    cabezaX,
    centroY + 12,

    "#4e833f",

    5 * escala

  );


  pintarHoja(

    centroX,

    suelo -
    (
      suelo -
      centroY
    ) * .35,

    -1,

    .63 * escala

  );


  pintarHoja(

    centroX + 2,

    suelo -
    (
      suelo -
      centroY
    ) * .58,

    1,

    .55 * escala

  );


  for (
    let angulo = 0;
    angulo < 360;
    angulo += 30
  ) {

    pintarPetalo(

      cabezaX,
      centroY,
      angulo,

      55 * escala,
      17 * escala,

      "#FFD426"

    );

  }


  for (
    let angulo = 15;
    angulo < 360;
    angulo += 30
  ) {

    pintarPetalo(

      cabezaX,
      centroY,
      angulo,

      43 * escala,
      13 * escala,

      "#F4BF17"

    );

  }


  dibujarCentro(

    cabezaX,
    centroY,
    18 * escala

  );

}


/* ==========================================
   RAMO ESTÁTICO
========================================== */

function dibujarRamoEstatico() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const suelo =
    H + 45;

  const flores =
    obtenerFlores();


  /*
    Dibujamos primero las flores laterales
    y dejamos la central para el final,
    para que se vea un poco más al frente.
  */

  const orden = [
    3,
    4,
    1,
    2,
    0
  ];


  for (const indice of orden) {

    const flor =
      flores[indice];

    crearFlorEstatica(
      flor.x,
      flor.y,
      suelo,
      flor.escala,
      flor.inclinacion
    );

  }

}


/* ==========================================
   RAMO ANIMADO
========================================== */

async function dibujarRamo() {

  const suelo =
    H + 45;

  const flores =
    obtenerFlores();


  await crearFlor(
    flores[0].x,
    flores[0].y,
    suelo,
    flores[0].escala,
    flores[0].inclinacion
  );


  await Promise.all([

    crearFlor(
      flores[1].x,
      flores[1].y,
      suelo,
      flores[1].escala,
      flores[1].inclinacion
    ),

    crearFlor(
      flores[2].x,
      flores[2].y,
      suelo,
      flores[2].escala,
      flores[2].inclinacion
    )

  ]);


  await Promise.all([

    crearFlor(
      flores[3].x,
      flores[3].y,
      suelo,
      flores[3].escala,
      flores[3].inclinacion
    ),

    crearFlor(
      flores[4].x,
      flores[4].y,
      suelo,
      flores[4].escala,
      flores[4].inclinacion
    )

  ]);


  /*
    Marcamos como finalizada ANTES del ajuste.
    Luego recreamos el canvas usando el tamaño
    actual de la pantalla. Esto también corrige
    si hubo zoom mientras se estaban dibujando.
  */

  animacionTerminada = true;

  ajustarCanvas();
  dibujarRamoEstatico();


  await esperar(800);


  document
    .getElementById(
      "mensajeContenedor"
    )
    .classList
    .add(
      "visible"
    );


  await esperar(900);


  await escribirMensaje();

}


/* ==========================================
   EFECTO DE ESCRITURA
========================================== */

async function escribirMensaje() {

  const elemento =
    document.getElementById(
      "texto"
    );


  const mensaje =
`Ayer te llevé flores de verdad.

Hoy quería dejarte un detalle diferente.

Me gustó mucho compartir contigo, y me hizo ilusión hacerte esto.

No hace falta decir demasiado:
me gusta conocerte y me gusta pasar tiempo contigo.

Solo quería sacarte una sonrisa con estas flores hechas de otra manera.`;


  elemento.textContent = "";


  for (
    let i = 0;
    i < mensaje.length;
    i++
  ) {

    elemento.textContent +=
      mensaje[i];


    if (
      mensaje[i] === "." ||
      mensaje[i] === ":" ||
      mensaje[i] === "…"
    ) {

      await esperar(280);

    }

    else if (
      mensaje[i] === "\n"
    ) {

      await esperar(380);

    }

    else {

      await esperar(32);

    }

  }


  document
    .getElementById(
      "cursor"
    )
    .style
    .display =
    "none";


  await esperar(650);


  document
    .getElementById(
      "final"
    )
    .classList
    .add(
      "visible"
    );

}


/* ==========================================
   INICIAR
========================================== */

document
  .getElementById(
    "boton"
  )
  .addEventListener(
    "click",
    async () => {

      if (animacionIniciada) {
        return;
      }

      animacionIniciada = true;


      document
        .getElementById(
          "inicio"
        )
        .classList
        .add(
          "oculto"
        );


      await esperar(1000);


      dibujarRamo();

    }
  );

</script>
